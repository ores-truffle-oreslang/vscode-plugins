name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
      - name: Install pinned TextMate and Oniguruma test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Validate compiler source pins offline
        run: node scripts/check-upstream-syntax.mjs


  vscode-extension-host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
      - name: Install pinned extension test runner
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run actual VS Code Extension Host with Xvfb
        run: xvfb-run -a npm run test:extension-host

  vscode-restricted-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
      - name: Install pinned Extension Host runner
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run real untrusted-workspace Restricted Mode smoke
        env:
          ORESLANG_TEST_MODE: untrusted
        run: xvfb-run -a npm run test:extension-host
